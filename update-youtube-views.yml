name: Refresh YouTube view counts
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update public YouTube statistics cache
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_youtube_views.py
      - name: Commit refreshed cache (only if changed)
        run: |
          if git diff --quiet -- assets/data/youtube-views.json; then
            echo "No new statistics to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/youtube-views.json
          git commit -m "Refresh YouTube video views"
          git push
